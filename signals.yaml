## Edit the fields below to match your design. ##
## Required fields:
##     IF_ID_Instruction: # pipelined register that holds the instrucion being output from the IF stage, not the PC register.
##     IF_ID_PC: # pipelined register that holds the PC being output from the IF stage.
##     Instruction_Cache: # instruction cache register array
##     Data_Cache: # data cache register array
## Optional fields:
##     trace (list of signals to be printed in the trace file, in order of appearance in the trace file)

IF_ID_Instruction: ("wInstr")
IF_ID_PC: ("wPc")
Instruction_Cache: ("instr_cache", "data")
Data_Cache: ("data_cache", "data")
trace: [id_stage_reg, ex_stage, data_cache, wb_stage, hd, fwd]
